name: CI

# Verificação de qualidade. Não fala com o Supabase, não chama a InfinitePay e
# não faz deploy — só instala, verifica e compila. As migrations do repositório
# são aplicadas apenas em bancos de teste descartáveis: o Postgres em memória dos
# testes e o contêiner `postgres` deste job, usado pelos testes de concorrência,
# que precisam de sessões independentes. Nenhum dos dois sobrevive ao job.
on:
  push:
    branches: [main]
  pull_request:

# Somente leitura do repositório: o workflow não escreve nada.
permissions:
  contents: read

# Um push novo na mesma ref cancela a execução anterior ainda em andamento.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Postgres efêmero, só deste job. Não tem dado nenhum: cada execução dos
    # testes cria um banco de nome aleatório nele e o apaga no fim.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 24 é a mesma linha usada na validação local. O runner de testes
      # depende de --experimental-strip-types para ler os .ts direto.
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # O Corepack instala exatamente a versão de pnpm fixada em
      # package.json > packageManager, que é a que gerou o pnpm-lock.yaml.
      - name: Habilitar Corepack
        run: corepack enable

      - name: Conferir versões
        run: |
          node --version
          pnpm --version

      - name: Localizar store do pnpm
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache do store do pnpm
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      # --frozen-lockfile falha se package.json e pnpm-lock.yaml divergirem.
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Checagem de tipos
        run: pnpm exec tsc --noEmit

      # TEST_DATABASE_URL aponta para o contêiner acima. Com ela, os testes de
      # concorrência rodam de verdade; sem ela, no CI, eles falham em vez de serem
      # pulados.
      - name: Testes
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      # O build não precisa de credenciais: sem Supabase configurado a aplicação
      # cai nos estados de "configuração ausente" e compila normalmente.
      - name: Build
        run: pnpm run build
